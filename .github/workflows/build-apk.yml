name: Build debug APK

# Builds an installable test APK on GitHub's servers, so no Android Studio is
# needed. Run it from the Actions tab ("Run workflow") or by pushing.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: NFC protocol self-test (no Android SDK needed)
        run: bash tools/selftest.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: payswiftly-tap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
